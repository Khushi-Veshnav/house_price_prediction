<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Price Predictor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c2333; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; --grid:#eceef3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1320; --card:#171c2e; --text:#e8ebf5; --muted:#98a2b8; --accent:#5b8cff; --border:#2a3148; --grid:#242b42; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .layout { display:grid; grid-template-columns: 340px 1fr; gap:20px; align-items:start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
  form { display:grid; gap:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); }
  input, select { padding:9px 10px; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  small { font-size:.72rem; }
  button { padding:12px; font-size:1rem; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #result { margin-top:18px; text-align:center; display:none; }
  #result .price { font-size:2.3rem; font-weight:700; color:var(--accent); }
  .muted { color:var(--muted); font-size:.85rem; }
  #error { color:#dc2626; margin-top:12px; text-align:center; }
  .chart-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .chart-head label { flex-direction:row; align-items:center; gap:8px; }
  svg { width:100%; height:auto; display:block; }
  svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .legend { display:flex; align-items:center; gap:8px; font-size:.75rem; color:var(--muted); margin-top:6px; }
  .legend .bar { flex:0 0 140px; height:8px; border-radius:4px; background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725); }
  #tip { position:fixed; pointer-events:none; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:.78rem; display:none; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index:5; }
  details { margin-top:20px; }
  summary { cursor:pointer; font-weight:600; }
  .tbl { overflow-x:auto; margin-top:10px; }
  table { border-collapse:collapse; width:100%; font-size:.82rem; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  footer { margin-top:20px; color:var(--muted); font-size:.85rem; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>🏠 House Price Prediction</h1>
  <p class="sub">Linear Regression model served through a Flask API on Vercel.</p>

  <div class="layout">
    <section class="card">
      <h2>Property details</h2>
      <form id="form"><button type="submit" id="btn">Predict price</button></form>
      <div id="error"></div>
      <div id="result"><div class="muted">Estimated price</div><div class="price" id="price"></div></div>
    </section>

    <section class="card">
      <div class="chart-head">
        <h2 style="margin:0">Where this fits in the data</h2>
        <label class="muted">X axis <select id="xsel"></select></label>
      </div>
      <svg id="chart" viewBox="0 0 700 420" role="img" aria-label="Scatter plot of house prices"></svg>
      <div class="legend"><span id="clabel"></span><span id="cmin"></span><span class="bar"></span><span id="cmax"></span></div>
    </section>
  </div>

  <details class="card">
    <summary>Dataset preview</summary>
    <div class="tbl"><table id="tbl"></table></div>
  </details>
  <footer id="foot"></footer>
</main>
<div id="tip"></div>

<script>
const $ = id => document.getElementById(id);
const form = $("form"), btn = $("btn"), errEl = $("error"), resEl = $("result"), svg = $("chart"), tip = $("tip");
const NS = "http://www.w3.org/2000/svg";
const label = f => f.replace(/_/g, " ");
const fmt = n => Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.abs(n) >= 1e3 ? Math.round(n / 1e3) + "k" : String(+n.toFixed(1));
const money = n => "$" + Math.round(n).toLocaleString();
let features = [], target = "", data = null, colorFeat = "", pred = null; // pred = {inputs, price}

// viridis-like ramp
const STOPS = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
function ramp(t) {
  t = Math.min(1, Math.max(0, t)) * (STOPS.length - 1);
  const i = Math.min(Math.floor(t), STOPS.length - 2), f = t - i;
  return "rgb(" + STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f)).join(",") + ")";
}
const el = (name, attrs, text) => {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};

function drawChart() {
  if (!data) return;
  const xf = $("xsel").value, xi = data.columns.indexOf(xf), yi = data.columns.indexOf(target), ci = data.columns.indexOf(colorFeat);
  const W = 700, H = 420, m = { l: 64, r: 16, t: 12, b: 44 };
  const xs = data.rows.map(r => r[xi]), ys = data.rows.map(r => r[yi]), cs = data.rows.map(r => r[ci]);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)], [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  const [c0, c1] = [Math.min(...cs), Math.max(...cs)];
  const px = v => m.l + (v - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const py = v => H - m.b - (v - y0) / (y1 - y0 || 1) * (H - m.t - m.b);

  svg.replaceChildren();
  for (let i = 0; i <= 5; i++) {
    const yv = y0 + (y1 - y0) * i / 5, xv = x0 + (x1 - x0) * i / 5;
    svg.append(el("line", { x1: m.l, x2: W - m.r, y1: py(yv), y2: py(yv), stroke: "var(--grid)" }));
    svg.append(el("text", { x: m.l - 8, y: py(yv) + 4, "text-anchor": "end" }, "$" + fmt(yv)));
    svg.append(el("text", { x: px(xv), y: H - m.b + 18, "text-anchor": "middle" }, fmt(xv)));
  }
  svg.append(el("text", { x: (W + m.l) / 2, y: H - 6, "text-anchor": "middle" }, label(xf)));
  svg.append(el("text", { x: 14, y: H / 2, "text-anchor": "middle", transform: `rotate(-90 14 ${H / 2})` }, label(target)));

  const g = el("g", {});
  data.rows.forEach(r => {
    const c = el("circle", { cx: px(r[xi]), cy: py(r[yi]), r: 3.2, fill: ramp((r[ci] - c0) / (c1 - c0 || 1)), "fill-opacity": .6 });
    c.addEventListener("mousemove", e => {
      tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px";
      tip.innerHTML = `${label(xf)}: <b>${fmt(r[xi])}</b><br>${label(target)}: <b>${money(r[yi])}</b><br>${label(colorFeat)}: <b>${r[ci]}</b>`;
    });
    c.addEventListener("mouseleave", () => tip.style.display = "none");
    g.append(c);
  });
  svg.append(g);

  if (pred) { // red star = the user's prediction
    const cx = px(Math.min(Math.max(pred.inputs[xf], x0), x1)), cy = py(pred.price);
    const pts = Array.from({ length: 10 }, (_, k) => {
      const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 6 : 15;
      return (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1);
    }).join(" ");
    svg.append(el("polygon", { points: pts, fill: "#ef4444", stroke: "#fff", "stroke-width": 1.5 }));
    svg.append(el("text", { x: cx, y: cy - 20, "text-anchor": "middle", style: "fill:#ef4444;font-weight:600" }, "Your prediction"));
  }
  $("clabel").textContent = label(colorFeat) + ":"; $("cmin").textContent = c0; $("cmax").textContent = c1;
}

function drawTable() {
  const rows = data.rows.slice(0, 20);
  $("tbl").innerHTML = "<thead><tr>" + data.columns.map(c => `<th>${label(c)}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map(v => `<td>${v.toLocaleString()}</td>`).join("") + "</tr>").join("") + "</tbody>";
}

async function init() {
  try {
    const [s, d] = await Promise.all([fetch("/api/schema").then(r => r.json()), fetch("/api/data").then(r => r.json())]);
    features = s.features; data = d; target = d.columns[d.columns.length - 1];
    colorFeat = features[1] || features[0];
    for (const f of features) {
      const [lo, hi] = s.ranges[f], def = s.defaults[f], int = Number.isInteger(lo) && Number.isInteger(hi);
      const wrap = document.createElement("label");
      wrap.innerHTML = `${label(f)}<input name="${f}" type="number" required
        min="${int ? lo : lo.toFixed(2)}" max="${int ? hi : hi.toFixed(2)}" step="${int ? 1 : "any"}"
        value="${int ? Math.round(def) : def.toFixed(2)}"><small>Range: ${int ? lo : lo.toFixed(1)} – ${int ? hi : hi.toFixed(1)}</small>`;
      form.insertBefore(wrap, btn);
      $("xsel").append(new Option(label(f), f));
    }
    $("foot").textContent = `${s.model} · R² ${s.metrics.R2.toFixed(3)} · MAE ${money(s.metrics.MAE)} · ${s.n_rows} training rows`;
    $("xsel").addEventListener("change", drawChart);
    drawChart(); drawTable();
  } catch (e) { errEl.textContent = "Could not load model or dataset."; }
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  errEl.textContent = ""; btn.disabled = true;
  const body = Object.fromEntries(features.map(f => [f, parseFloat(form.elements[f].value)]));
  try {
    const r = await fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || "Prediction failed");
    $("price").textContent = money(out.predicted_price);
    resEl.style.display = "block";
    pred = { inputs: body, price: out.predicted_price };
    drawChart();
  } catch (err) { errEl.textContent = err.message; resEl.style.display = "none"; }
  btn.disabled = false;
});
init();
</script>
</body>
</html>
